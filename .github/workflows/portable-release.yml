name: Windows x64 portable package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
          architecture: x64
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: python -m pytest tests -q

  package:
    needs: tests
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
          architecture: x64
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: python packaging/build_portable.py
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag must match VERSION (v$version)" }
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AntigravityAccountSwitcher-win10-x64-portable
          path: |
            dist/AntigravityAccountSwitcherPortable-*-win10-x64-portable.zip
            dist/AntigravityAccountSwitcherPortable-*-source.zip
            dist/SHA256SUMS
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AntigravityAccountSwitcher-win10-x64-portable
          path: release-assets
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw 'No release assets were downloaded' }
          gh release create $env:RELEASE_TAG @assets --repo $env:GH_REPO --draft --title $env:RELEASE_TAG --notes 'Windows 10 x64 portable build. See SHA256SUMS to verify the archives.'
